name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ros2:
    name: ROS 2 build and tests
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pytest python3-serial python3-colcon-common-extensions
      - name: Build
        shell: bash
        working-directory: ros2_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Test
        shell: bash
        working-directory: ros2_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --packages-select amr_base amr_perception --event-handlers console_cohesion+
          colcon test-result --verbose

  firmware:
    name: Arduino firmware build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        working-directory: firmware
        run: pio run
